# Render Blueprint for the Smart Buyer AI backend (FastAPI).
# Render -> New -> Blueprint -> pick this repository. The frontend goes to Vercel.
services:
  - type: web
    name: smart-buyer-ai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LOG_LEVEL
        value: INFO
